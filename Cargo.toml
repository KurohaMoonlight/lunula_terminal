[package]
name = "lunula_terminal"
version = "0.1.0"
edition = "2024"
default-run = "lunula_terminal"
description = "Ultra-lightweight GPU-accelerated terminal emulator with elastic wobble physics and built-in luna editor"

[[bin]]
name = "lunula_terminal"
path = "src/main.rs"

[[bin]]
name = "luna"
path = "src/bin/luna.rs"

[[bin]]
name = "lfetch"
path = "src/bin/lfetch.rs"

[[bin]]
name = "limg"
path = "src/bin/limg.rs"

[[bin]]
name = "lpm"
path = "src/bin/lpm.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glyphon = "0.12.0"
log = "0.4.35"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
mimalloc = { version = "0.1", default-features = false }
pollster = "1.0.1"
portable-pty = "0.9.0"
unicode-width = "0.2.3"
vte = "0.15.0"
wgpu = "30.0.2"
winit = "0.30.13"
yazi = "0.2.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
